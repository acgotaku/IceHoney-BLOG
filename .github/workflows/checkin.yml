name: check-pr

on:
  pull_request:
    branches:
    - master

jobs:
  check-pr:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Install pnpm
      uses: pnpm/action-setup@v4

    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version-file: .node-version
        cache: pnpm

    - name: Install dependencies
      run: pnpm install --frozen-lockfile

    - name: Check build
      run: pnpm build
